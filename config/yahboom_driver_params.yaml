hbot_driver_yahboom_node:
  ros__parameters:
    port: /dev/myserial
    timeout: 0.1
    debug: false
    wheel_diameter: 0.0675  # measured; = 2 x hbot_description config/hbot_geometry.yaml wheels.radius
    wheel_track: 0.19      # measured; must match hbot_description config/hbot_geometry.yaml wheels.track
    wheel_base: 0.15
    gear_ratio: 56
    encoder_resolution: 11
    max_rpm: 100
    cmd_vel_timeout: 0.5
    motor_polarity: [1, 1, 1, -1]
    encoder_polarity: [-1, 1, 1, 1]
    odom_frequency: 20
    odom_topic: odom
    odom_frame: odom
    robot_base_frame: base_footprint
    publish_odom_tf: true
    publish_imu: true
    imu_freq: 200
    systemstatus_frequency: 1
    pose_covariance_diagonal: [0.001, 0.001, 1.0e-9, 1.0e-9, 1.0e-9, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-9, 1.0e-9, 1.0e-9, 0.01]
